[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avsd"
version = "0.1.0"
description = "AI Village swarm dynamics: unified event table, Hawkes excitation, transmission lineage, change points."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.12",
    "numba>=0.59",
    "pandas>=2.2",
    "networkx>=3.2",
    "ruptures>=1.1.9",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "spacy>=3.7,<4",
    "huggingface_hub>=0.23",
    "pyyaml>=6",
    "typer>=0.12",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "orjson>=3.10",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3", "torch>=2.3"]
ethogram = ["hmmlearn>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
avsd = "avsd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/avsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
